name: Build and Release Artifacts

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.7

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      asset_tag: ${{ steps.meta.outputs.asset_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
      android_asset: ${{ steps.meta.outputs.android_asset }}
      ios_asset: ${{ steps.meta.outputs.ios_asset }}
      macos_asset: ${{ steps.meta.outputs.macos_asset }}
      windows_asset: ${{ steps.meta.outputs.windows_asset }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag belongs to master
        shell: bash
        run: |
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
            echo "Tag $GITHUB_REF_NAME is not pointing to a commit on master."
            exit 1
          fi

      - name: Generate release metadata
        id: meta
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re

          tag = os.environ['GITHUB_REF_NAME']
          asset_tag = re.sub(r'[^A-Za-z0-9._-]+', '-', tag).strip('-') or 'tag'
          release_name = f'Melisle {tag}'

          android_asset = f'melisle-android-{asset_tag}.apk'
          ios_asset = f'melisle-ios-{asset_tag}.ipa'
          macos_asset = f'melisle-macos-{asset_tag}.dmg'
          windows_asset = f'melisle-windows-{asset_tag}.exe'

          release_body = '\n'.join([
              'Automatic build from `master` tag.',
              '',
              f'- Tag: `{tag}`',
              f'- Commit: `{os.environ["GITHUB_SHA"]}`',
              f'- Workflow run: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              '',
              'Artifacts included in this release:',
              f'- `{android_asset}`',
              f'- `{ios_asset}` (unsigned, built with `--no-codesign`)',
              f'- `{macos_asset}`',
              f'- `{windows_asset}`',
          ])

          outputs = {
              'tag': tag,
              'asset_tag': asset_tag,
              'release_name': release_name,
              'android_asset': android_asset,
              'ios_asset': ios_asset,
              'macos_asset': macos_asset,
              'windows_asset': windows_asset,
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              for key, value in outputs.items():
                  fh.write(f'{key}={value}\n')
              fh.write(f'release_body<<EOF\n{release_body}\nEOF\n')
          PY

  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    env:
      ANDROID_ASSET: ${{ needs.prepare.outputs.android_asset }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package Android artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$ANDROID_ASSET"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/${{ env.ANDROID_ASSET }}
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iOS
    runs-on: macos-latest
    needs: prepare
    env:
      IOS_ASSET: ${{ needs.prepare.outputs.ios_asset }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without codesign
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          mkdir -p dist
          temp_dir="$RUNNER_TEMP/ios-package"
          rm -rf "$temp_dir"
          mkdir -p "$temp_dir/Payload"

          ios_app="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$ios_app" ]]; then
            echo 'Unable to locate iOS .app output.'
            exit 1
          fi

          cp -R "$ios_app" "$temp_dir/Payload/"
          (
            cd "$temp_dir"
            zip -qry "$GITHUB_WORKSPACE/dist/$IOS_ASSET" Payload
          )

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/${{ env.IOS_ASSET }}
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    env:
      MACOS_ASSET: ${{ needs.prepare.outputs.macos_asset }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS DMG
        shell: bash
        run: |
          mkdir -p dist
          dmg_root="$RUNNER_TEMP/macos-dmg"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"

          macos_app="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$macos_app" ]]; then
            echo 'Unable to locate macOS .app output.'
            exit 1
          fi

          ditto "$macos_app" "$dmg_root/$(basename "$macos_app")"
          hdiutil create -volname "Melisle" -srcfolder "$dmg_root" -ov -format UDZO "dist/$MACOS_ASSET"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/${{ env.MACOS_ASSET }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows
    runs-on: windows-latest
    needs: prepare
    env:
      WINDOWS_ASSET: ${{ needs.prepare.outputs.windows_asset }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releaseDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $distDir = (Resolve-Path 'dist').Path
          $appExe = Get-ChildItem -Path $releaseDir -Filter *.exe | Select-Object -First 1

          if (-not $appExe) {
            throw 'Unable to locate Windows executable output.'
          }

          $issPath = Join-Path $env:RUNNER_TEMP 'melisle-release.iss'
          $outputBaseName = [System.IO.Path]::GetFileNameWithoutExtension($env:WINDOWS_ASSET)
          $issContent = @(
            '#define MyAppName "Melisle"',
            ('#define MyAppVersion "{0}"' -f $env:GITHUB_REF_NAME),
            ('#define MyAppExeName "{0}"' -f $appExe.Name),
            '',
            '[Setup]',
            'AppId={{6F98B4D3-6578-4520-B7DB-3D39A5E6B102}',
            'AppName={#MyAppName}',
            'AppVersion={#MyAppVersion}',
            'AppPublisher=Leeero',
            'DefaultDirName={autopf}\{#MyAppName}',
            'DisableProgramGroupPage=yes',
            ('OutputDir={0}' -f $distDir),
            ('OutputBaseFilename={0}' -f $outputBaseName),
            'Compression=lzma',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'ArchitecturesAllowed=x64compatible',
            'ArchitecturesInstallIn64BitMode=x64compatible',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '[Files]',
            ('Source: "{0}\*"; DestDir: "{{app}}"; Flags: ignoreversion recursesubdirs createallsubdirs' -f $releaseDir),
            '',
            '[Icons]',
            'Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"',
            'Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon',
            '',
            '[Run]',
            'Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#MyAppName}}"; Flags: nowait postinstall skipifsilent'
          ) -join "`r`n"
          Set-Content -Path $issPath -Value $issContent -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" $issPath

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/${{ env.WINDOWS_ASSET }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android
      - ios
      - macos
      - windows
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ needs.prepare.outputs.release_body }}
          files: |
            release-assets/android-release/*
            release-assets/ios-release/*
            release-assets/macos-release/*
            release-assets/windows-release/*
          fail_on_unmatched_files: true
